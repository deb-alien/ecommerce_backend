services:
    mongodb:
        image: mongo:6.0.7
        container_name: mongodb
        restart: unless-stopped
        environment:
            MONGO_INITDB_ROOT_USERNAME: rootuser
            MONGO_INITDB_ROOT_PASSWORD: rootpass
        ports:
            - '27017:27017'
        volumes:
            - mongo_data:/data/db
        command: ['mongod', '--auth']

    redis:
        image: redis:7
        container_name: redis
        restart: unless-stopped
        command: redis-server --appendonly yes
        volumes:
            - redis_data:/data
        ports:
            - '6379:6379'

volumes:
    mongo_data:
    redis_data:
